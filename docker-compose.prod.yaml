name: conduit

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in the deployment workflow}
    ports:
      - "${FRONTEND_PORT:-8282}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - conduit

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in the deployment workflow}
    env_file:
      - .env.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - conduit

  database:
    image: ${POSTGRES_IMAGE:-postgres:16.14-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - conduit

networks:
  conduit:
    driver: bridge

volumes:
  database_data:
