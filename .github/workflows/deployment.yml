name: Deployment

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_image:
        required: true
        type: string
      backend_image:
        required: true
        type: string
    secrets:
      SUBMODULE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-validation:
    name: Validate deployment prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false

      - name: Verify files required by the deployment workflow
        run: |
          set -Eeuo pipefail

          test -f .github/workflows/deployment.yml
          test -f docker-compose.yaml
          test -f conduit-frontend/Dockerfile
          test -f conduit-backend/Dockerfile

      - name: Verify immutable image references
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -Eeuo pipefail

          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${FRONTEND_IMAGE}" =~ ^ghcr\.io/[a-z0-9._/-]+/conduit-frontend:${SOURCE_SHA}@sha256:[0-9a-f]{64}$ ]]
          [[ "${BACKEND_IMAGE}" =~ ^ghcr\.io/[a-z0-9._/-]+/conduit-backend:${SOURCE_SHA}@sha256:[0-9a-f]{64}$ ]]

          echo "Validated frontend image: ${FRONTEND_IMAGE}"
          echo "Validated backend image: ${BACKEND_IMAGE}"

      - name: Validate SSH deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail

          for variable_name in \
            SSH_HOST \
            SSH_KNOWN_HOSTS \
            SSH_PORT \
            SSH_PRIVATE_KEY \
            SSH_USER \
            DEPLOY_PATH 
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required deployment secret ${variable_name} is missing or empty."
              exit 1
            fi
          done

          [[ "${SSH_PORT}" =~ ^[0-9]+$ ]] || {
            echo "::error::SSH_PORT must be numeric."
            exit 1
          }
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || {
            echo "::error::SSH_PORT must be between 1 and 65535."
            exit 1
          }
          [[ "${SSH_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || {
            echo "::error::SSH_HOST has an invalid format."
            exit 1
          }
          [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "::error::SSH_USER has an invalid format."
            exit 1
          }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::DEPLOY_PATH must be an absolute path without whitespace."
            exit 1
          }
#test