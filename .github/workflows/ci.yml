name: CI

on:
  push:
    branches:
      - "feature/**"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Validate repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false

      - name: Verify required project files
        run: |
          set -Eeuo pipefail

          test -f docker-compose.yaml
          test -f conduit-frontend/Dockerfile
          test -f conduit-frontend/.dockerignore
          test -f conduit-frontend/package-lock.json
          test -f conduit-backend/Dockerfile
          test -f conduit-backend/.dockerignore
          test -f conduit-backend/requirements.txt

  frontend-build:
    name: Build Angular frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repository-validation

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: conduit-frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: conduit-frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: conduit-frontend
        run: npm run build -- --configuration production

  # Frontend and backend image builds are independent and can run in parallel.
  backend-image-build:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-validation
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false

      - name: Prepare backend image name
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${OWNER_LOWER}/conduit-backend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build backend image outside the VPS
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -Eeuo pipefail
          docker build --tag "${IMAGE}" ./conduit-backend

      - name: Publish backend image and record immutable reference
        if: github.event_name == 'push'
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -Eeuo pipefail

          PUSH_OUTPUT="$(docker push "${IMAGE}")"
          echo "${PUSH_OUTPUT}"
          DIGEST="$(awk '/digest: sha256:/ {print $3}' <<< "${PUSH_OUTPUT}" | tail -n 1)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE}@${DIGEST}" >> "${GITHUB_OUTPUT}"

  frontend-image-build:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - repository-validation
      - frontend-build
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          persist-credentials: false

      - name: Prepare frontend image name
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${OWNER_LOWER}/conduit-frontend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build frontend image outside the VPS
        env:
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -Eeuo pipefail

          API_URL="${FRONTEND_API_URL:-http://localhost:8000/api}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ -n "${FRONTEND_API_URL}" ]] || {
              echo "::error::Required repository secret FRONTEND_API_URL is missing or empty."
              exit 1
            }
            [[ "${FRONTEND_API_URL}" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?/api/?$ ]] || {
              echo "::error::FRONTEND_API_URL must be an HTTP(S) URL ending in /api."
              exit 1
            }
          fi

          docker build \
            --build-arg "API_URL=${API_URL}" \
            --tag "${IMAGE}" \
            ./conduit-frontend

      - name: Publish frontend image and record immutable reference
        if: github.event_name == 'push'
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -Eeuo pipefail

          PUSH_OUTPUT="$(docker push "${IMAGE}")"
          echo "${PUSH_OUTPUT}"
          DIGEST="$(awk '/digest: sha256:/ {print $3}' <<< "${PUSH_OUTPUT}" | tail -n 1)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE}@${DIGEST}" >> "${GITHUB_OUTPUT}"

  deployment-validation:
    name: Run deployment validation
    # The academy deployment target is the protected staging environment.
    # Main still runs CI, but it must not reuse staging deployment secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/conduit-deployment'
    needs:
      - repository-validation
      - frontend-build
      - backend-image-build
      - frontend-image-build
    uses: ./.github/workflows/deployment.yaml
    with:
      source_sha: ${{ github.sha }}
      frontend_image: ${{ needs.frontend-image-build.outputs.image }}
      backend_image: ${{ needs.backend-image-build.outputs.image }}
    # Environment secrets are not passed automatically to reusable workflows.
    # The called workflow references only the six staging deployment secrets.
    secrets: inherit
